name: Expo CI

on:
  push:
    branches:
      - main
      - feature/products
  pull_request:
    branches:
      - main

jobs:
  expo-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo project
        run: npx expo-doctor
